[workspace]
resolver = "2"
members = ["domain", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1.29.0", features = ["v4", "v7"] }
cartouche-domain = { path = "domain" }

# `make api` runs a debug build: unoptimised image decoding and WebP encoding took about 118 s on a
# 24-megapixel photo. Dependencies are compiled optimised; the workspace crates stay in debug for
# fast rebuilds and full debug info.
[profile.dev.package."*"]
opt-level = 3
