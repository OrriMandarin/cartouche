[package]
name = "cartouche-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only code (/api/test/* routes, seed binary, HTTP-driven clock). Never in `default`.
test-support = []

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
cartouche-domain.workspace = true
chrono.workspace = true
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"] }
serde.workspace = true
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url.workspace = true
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
