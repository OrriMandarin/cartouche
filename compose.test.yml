# Containerised stack for end-to-end tests: Postgres 15432, API 18080, web 13000.
# Every value is hardcoded on purpose (no ${VAR} interpolation): the dev defaults exported
# by the Makefile and any local .env must never leak into this stack.
name: cartouche-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cartouche
      POSTGRES_PASSWORD: cartouche
      POSTGRES_DB: cartouche
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartouche -d cartouche"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Same dev-only Garage and key as compose.dev.yml (fixed, public on purpose).
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK26ee770c40b79441cf5dbd98
      GARAGE_DEFAULT_SECRET_KEY: 1f40d56d775b769e61c9a48d9823a6e552b4a2e658875ef32fd5602a99659ca4
      GARAGE_DEFAULT_BUCKET: cartouche-media
    ports:
      - "127.0.0.1:13900:3900"
      - "127.0.0.1:13902:3902"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: `up --wait` accepts it once it has exited with code 0.
  garage-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/init.sh"]
    restart: "no"
    environment:
      ADMIN_URL: http://garage:3903
      ADMIN_TOKEN: cartouche-dev-admin-token
      S3_URL: http://garage:3900
      S3_ACCESS_KEY: GK26ee770c40b79441cf5dbd98
      S3_SECRET_KEY: 1f40d56d775b769e61c9a48d9823a6e552b4a2e658875ef32fd5602a99659ca4
      PUBLIC_BUCKET: cartouche-media
      PRIVATE_BUCKET: cartouche-media-private
      APP_ORIGIN: http://localhost:13000
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FEATURES: test-support
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: test
      DATABASE_URL: postgres://cartouche:cartouche@postgres:5432/cartouche
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://localhost:13000
      AUTH_ISSUER: cartouche-test-issuer
      # The API fetches its own test JWKS.
      AUTH_JWKS_URL: http://localhost:8080/api/test/jwks.json
      ADMIN_USER_IDS: seed-admin
      SIGNUP_MODE: approval
      MEDIA_STORAGE: s3
      MEDIA_S3_ENDPOINT: http://garage:3900
      MEDIA_S3_BUCKET: cartouche-media
      MEDIA_S3_PRIVATE_BUCKET: cartouche-media-private
      MEDIA_S3_REGION: garage
      MEDIA_S3_ACCESS_KEY_ID: GK26ee770c40b79441cf5dbd98
      MEDIA_S3_SECRET_ACCESS_KEY: 1f40d56d775b769e61c9a48d9823a6e552b4a2e658875ef32fd5602a99659ca4
      MEDIA_PUBLIC_BASE_URL: http://localhost:13902
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        CARTOUCHE_BUILD_PROFILE: test
        NEXT_PUBLIC_AUTH_PROVIDER: test
        # Rewrites are baked at build time, hence a build argument as well as a runtime variable.
        API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
